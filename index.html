<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>狗狗黑板後台 - NHK 修正版</title>
    <style>
        body { background: #000; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: -apple-system, "Microsoft JhengHei", sans-serif; }
        
        .phone-frame { position: relative; width: 100vw; height: 100vh; max-width: 450px; max-height: 800px; background: #000; overflow: hidden; }
        #v { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #drawingCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; mix-blend-mode: screen; filter: blur(0.4px) brightness(1.1); }

        /* NHK 結尾標誌：確保不論什麼模式都存在，且 z-index 夠高 */
        #nhk-end {
            position: absolute; bottom: 40px; right: 25px; z-index: 99;
            color: white; font-weight: bold; font-family: "serif", "SimSun", "PMingLiU";
            opacity: 0; transition: opacity 0.5s ease-in; pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5); display: flex; align-items: flex-end; gap: 8px;
        }
        .nhk-logo { border: 2px solid white; padding: 2px 8px; font-size: 22px; line-height: 1; letter-spacing: 2px; }
        .nhk-text { font-size: 14px; padding-bottom: 2px; letter-spacing: 1px; }
        .nhk-final { font-size: 32px; margin-right: 5px; font-style: italic; }

        /* 介面層級 */
        .admin-ui {
            position: absolute; bottom: 30px; width: 100%; z-index: 10;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding-bottom: 20px;
        }
        
        /* 當處於收訊者模式時，只隱藏 admin-ui，不隱藏 nhk-end */
        body.viewer-mode .admin-ui { display: none !important; }

        input { padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); background: rgba(20,20,20,0.9); color: #fff; text-align: center; width: 85%; font-size: 16px; outline: none; }
        .btn-row { display: flex; gap: 10px; width: 88%; }
        button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; transition: transform 0.1s; }
        button:active { transform: scale(0.96); }
        .confirm-btn { background: #ffffff; color: #000; }
        .share-btn { background: #007AFF; color: #fff; }

        #toast { position: fixed; top: 40px; background: #32D74B; color: #fff; padding: 10px 25px; border-radius: 20px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 100; pointer-events: none; }
    </style>
</head>
<body class="admin-mode">

    <div id="toast">✅ 連結已複製</div>

    <div class="phone-frame">
        <video id="v" src="White6.mp4" autoplay loop muted playsinline></video>
        <canvas id="drawingCanvas"></canvas>

        <div id="nhk-end">
            <span class="nhk-final">終</span>
            <div style="text-align: right;">
                <div class="nhk-text">制作・著作</div>
                <div class="nhk-logo">ＮＨＫ</div>
            </div>
        </div>

        <div class="admin-ui">
            <input type="text" id="userInput" value="Minnie 2026 新年快樂" placeholder="輸入訊息...">
            <div class="btn-row">
                <button class="confirm-btn" onclick="updatePreview()">確認預覽</button>
                <button class="share-btn" onclick="shareAndCopy()">分享連結</button>
            </div>
        </div>
    </div>

<script>
    const v = document.getElementById('v');
    const canvas = document.getElementById('drawingCanvas');
    const nhkEnd = document.getElementById('nhk-end');
    const ctx = canvas.getContext('2d');
    const inputField = document.getElementById('userInput');
    
    let currentText = inputField.value;
    let lastPoints = null;

    // --- 模式判斷 ---
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('text')) {
        currentText = decodeURIComponent(urlParams.get('text'));
        document.body.className = 'viewer-mode'; // 確保 class 切換正確
        // 收訊者點擊畫面解除靜音
        window.onclick = () => { v.muted = false; };
    }

    function updatePreview() {
        currentText = inputField.value;
        v.currentTime = 0;
    }

    function shareAndCopy() {
        const textToShare = inputField.value;
        const shareUrl = `${window.location.origin}${window.location.pathname}?text=${encodeURIComponent(textToShare)}`;
        navigator.clipboard.writeText(shareUrl).then(() => {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        });
    }

    // --- 繪製邏輯 (維持不變) ---
    function drawSmartChalk(pts, text) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const temp = document.createElement('canvas');
        temp.width = 600; temp.height = 400;
        const tCtx = temp.getContext('2d');
        const len = text.length || 1;
        let fontSize = Math.max(35, Math.min(95, 450 / Math.sqrt(len * 2))); 
        tCtx.fillStyle = "rgba(255,255,255,0.95)";
        tCtx.textAlign = "center";
        tCtx.textBaseline = "middle";
        let lines = [text];
        if (len > 8) { fontSize *= 1.2; const mid = Math.ceil(len / 2); lines = [text.substring(0, mid), text.substring(mid)]; }
        tCtx.font = `bold ${fontSize}px "Microsoft JhengHei", sans-serif`;
        lines.forEach((line, i) => {
            const yOffset = (lines.length > 1) ? (i * fontSize * 1.1 - (fontSize/2)) : 0;
            tCtx.fillText(line, 300, 200 + yOffset);
        });
        const p = pts.map(pt => ({ x: pt.x * canvas.width, y: pt.y * canvas.height }));
        const centerX = (p[0].x + p[1].x + p[2].x + p[3].x) / 4;
        const centerY = (p[0].y + p[1].y + p[2].y + p[3].y) / 4;
        const angle = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
        const boardWidth = Math.sqrt(Math.pow(p[1].x - p[0].x, 2) + Math.pow(p[1].y - p[0].y, 2));
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle);
        const scale = (boardWidth * 0.84) / temp.width;
        ctx.scale(scale, scale);
        ctx.drawImage(temp, -300, -200);
        ctx.restore();
    }

    // --- 數據 (縮減示意，請沿用你原本完整的數據) ---
    const trackingData = {"3.64":[{"x":"0.1071","y":"0.6915"},{"x":"0.9238","y":"0.6809"},{"x":"0.9238","y":"0.9468"},{"x":"0.1905","y":"0.9839"}],"6.04":[{"x":"0.2429","y":"0.6651"},{"x":"0.8929","y":"0.6347"},{"x":"0.9000","y":"0.8503"},{"x":"0.2929","y":"0.8741"}]}; 
    // ^ 請在此處補回您完整的 trackingData 物件 ^

    const keys = Object.keys(trackingData).map(Number).sort((a,b)=>a-b);
    function lerpVal(a, b, t) { return a + (b - a) * t; }

    function getSmoothPoints(currentTime) {
        if (currentTime < keys[0] || currentTime > keys[keys.length-1]) return null;
        let i = 0;
        while (i < keys.length - 2 && keys[i+1] < currentTime) i++;
        const t1 = keys[i], t2 = keys[i+1];
        const p1 = trackingData[t1], p2 = trackingData[t2];
        const ratio = (currentTime - t1) / (t2 - t1);
        let targetPoints = p1.map((pt, idx) => ({
            x: lerpVal(parseFloat(pt.x), parseFloat(p2[idx].x), ratio),
            y: lerpVal(parseFloat(pt.y), parseFloat(p2[idx].y), ratio)
        }));
        if (!lastPoints) lastPoints = targetPoints;
        else {
            const factor = 0.18;
            lastPoints = targetPoints.map((pt, idx) => ({
                x: lastPoints[idx].x + (pt.x - lastPoints[idx].x) * factor,
                y: lastPoints[idx].y + (pt.y - lastPoints[idx].y) * factor
            }));
        }
        return lastPoints;
    }

    function animate() {
        // --- 修正後的 NHK 顯示邏輯 ---
        const timeLeft = v.duration - v.currentTime;
        // 只要剩餘時間小於 1.2 秒且大於 0.1 秒就顯示 (增加一點緩衝)
        if (v.duration > 0 && timeLeft <= 1.2 && timeLeft > 0.1) {
            nhkEnd.style.opacity = '1';
        } else {
            nhkEnd.style.opacity = '0';
        }

        const pts = getSmoothPoints(v.currentTime);
        if (pts) drawSmartChalk(pts, currentText);
        else { ctx.clearRect(0,0,canvas.width,canvas.height); lastPoints = null; }
        requestAnimationFrame(animate);
    }

    v.addEventListener('loadedmetadata', () => {
        canvas.width = v.clientWidth;
        canvas.height = v.clientHeight;
        animate();
    });
</script>
</body>
</html>
