    // 錄影核心功能
    async function startCapture() {
        const btn = document.getElementById('recBtn');
        btn.innerText = "錄影中..."; btn.disabled = true;
        
        const exportCanvas = document.createElement('canvas');
        exportCanvas.width = v.videoWidth || 450;
        exportCanvas.height = v.videoHeight || 800;
        const eCtx = exportCanvas.getContext('2d');
        const stream = exportCanvas.captureStream(30);
        const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp9' });
        const chunks = [];

        mediaRecorder.ondataavailable = e => chunks.push(e.data);
        mediaRecorder.onstop = () => {
            const blob = new Blob(chunks, { type: 'video/webm' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Dog_KUO_Message.webm`;
            a.click();
            btn.innerText = "錄製"; btn.disabled = false;
        };

        v.currentTime = 0; v.play(); mediaRecorder.start();
        
        function renderLoop() {
            if (mediaRecorder.state === "recording") {
                eCtx.drawImage(v, 0, 0, exportCanvas.width, exportCanvas.height);
                eCtx.drawImage(canvas, 0, 0, exportCanvas.width, exportCanvas.height);
                
                // 錄影時繪製 KUO Logo
                if (kuoEnd.style.opacity === '1') {
                   eCtx.save();
                   eCtx.fillStyle = "white";
                   eCtx.shadowBlur = 10; eCtx.shadowColor = "black";
                   eCtx.font = "bold 48px serif";
                   eCtx.fillText("終", exportCanvas.width - 210, exportCanvas.height - 110);
                   eCtx.font = "bold 13px sans-serif";
                   eCtx.fillText("制作・著作", exportCanvas.width - 150, exportCanvas.height - 135);
                   eCtx.lineWidth = 3; eCtx.strokeStyle = "white";
                   eCtx.strokeRect(exportCanvas.width - 150, exportCanvas.height - 125, 100, 38);
                   eCtx.font = "bold 26px sans-serif";
                   // 關鍵修正：錄影時輸出字元改為 ＫＵＯ
                   eCtx.fillText("ＫＵＯ", exportCanvas.width - 140, exportCanvas.height - 96);
                   eCtx.restore();
                }
                requestAnimationFrame(renderLoop);
            }
        }
        renderLoop();
        setTimeout(() => { if(mediaRecorder.state === "recording") mediaRecorder.stop(); }, 6500);
    }

    // 動畫渲染邏輯
    const keys = Object.keys(trackingData).map(Number).sort((a,b)=>a-b);
    function getPointsAtTime(t) {
        if (t < keys[0] || t > keys[keys.length-1]) return null;
        let idx = keys.findIndex(k => k > t) - 1;
        if (idx < 0) idx = 0;
        const t1 = keys[idx], t2 = keys[idx+1], r = (t - t1) / (t2 - t1);
        return trackingData[t1].map((p, i) => ({
            x: parseFloat(p.x) + (parseFloat(trackingData[t2][i].x) - parseFloat(p.x)) * r,
            y: parseFloat(p.y) + (parseFloat(trackingData[t2][i].y) - parseFloat(p.y)) * r
        }));
    }
    
    function drawSmartChalk(pts, text) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const temp = document.createElement('canvas'); temp.width = 600; temp.height = 400;
        const tCtx = temp.getContext('2d');
        const len = text.length || 1;
        let fontSize = Math.max(35, Math.min(95, 450 / Math.sqrt(len * 2)));
        tCtx.fillStyle = "rgba(255,255,255,0.92)"; tCtx.textAlign = "center"; tCtx.textBaseline = "middle";
        let lines = (len > 8) ? [text.substring(0, Math.ceil(len/2)), text.substring(Math.ceil(len/2))] : [text];
        tCtx.font = `bold ${fontSize}px "Microsoft JhengHei", sans-serif`;
        lines.forEach((line, i) => tCtx.fillText(line, 300, (lines.length > 1) ? (200 + (i * fontSize * 1.1 - (fontSize/2))) : 200));
        const p = pts.map(pt => ({ x: pt.x * canvas.width, y: pt.y * canvas.height }));
        const cX = (p[0].x + p[1].x + p[2].x + p[3].x) / 4, cY = (p[0].y + p[1].y + p[2].y + p[3].y) / 4;
        const angle = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x), bW = Math.sqrt(Math.pow(p[1].x - p[0].x, 2) + Math.pow(p[1].y - p[0].y, 2));
        ctx.save(); ctx.translate(cX, cY); ctx.rotate(angle);
        ctx.scale((bW * 0.88) / 600, (bW * 0.88) / 600); ctx.drawImage(temp, -300, -200); ctx.restore();
    }
    
    function animate() {
        const cur = v.currentTime;
        kuoEnd.style.opacity = (cur >= 4.8) ? '1' : '0';
        const pts = getPointsAtTime(cur);
        if (pts) drawSmartChalk(pts, currentText);
        else ctx.clearRect(0,0,canvas.width,canvas.height);
        requestAnimationFrame(animate);
    }
    
    v.addEventListener('loadedmetadata', () => { 
        canvas.width = v.clientWidth; canvas.height = v.clientHeight; 
        animate(); 
    });
</script>
</body>
</html>
