<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>狗狗黑板 - 最終修正版</title>
    <style>
        body { background: #000; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: -apple-system, "Microsoft JhengHei", sans-serif; }
        .phone-frame { position: relative; width: 100vw; height: 100vh; max-width: 450px; max-height: 800px; background: #000; overflow: hidden; }
        #v { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        #drawingCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; pointer-events: none; mix-blend-mode: screen; filter: blur(0.3px) brightness(1.2); }

        /* 強制顯示 NHK：不受 admin-ui 影響 */
        #nhk-end {
            position: absolute; bottom: 50px; right: 25px; 
            z-index: 9999 !important; /* 最高層級 */
            color: white; font-weight: bold; font-family: "serif", "SimSun", "PMingLiU", serif;
            opacity: 0; transition: opacity 0.4s ease-in-out; pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9); display: flex; align-items: flex-end; gap: 8px;
        }
        .nhk-logo { border: 2.5px solid white; padding: 2px 8px; font-size: 24px; line-height: 1.1; letter-spacing: 2px; }
        .nhk-text { font-size: 15px; padding-bottom: 2px; letter-spacing: 1px; line-height: 1.2; text-align: right; }
        .nhk-final { font-size: 38px; margin-right: 5px; font-style: italic; }

        .admin-ui {
            position: absolute; bottom: 30px; width: 100%; z-index: 100;
            display: flex; flex-direction: column; align-items: center; gap: 12px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding-bottom: 20px;
        }
        
        /* 確保收訊者模式只隱藏輸入框，不影響 NHK */
        body.viewer-mode .admin-ui { visibility: hidden; pointer-events: none; }
        
        input { padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); background: rgba(20,20,20,0.9); color: #fff; text-align: center; width: 85%; font-size: 16px; outline: none; }
        .btn-row { display: flex; gap: 10px; width: 88%; }
        button { flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; font-size: 14px; }
        .confirm-btn { background: #ffffff; color: #000; }
        .share-btn { background: #007AFF; color: #fff; }
        #toast { position: fixed; top: 40px; background: #32D74B; color: #fff; padding: 10px 25px; border-radius: 20px; font-weight: bold; opacity: 0; transition: opacity 0.3s; z-index: 10000; }
    </style>
</head>
<body class="admin-mode">

    <div id="toast">✅ 連結已複製</div>

    <div class="phone-frame">
        <video id="v" src="White6.mp4" autoplay loop muted playsinline></video>
        <canvas id="drawingCanvas"></canvas>

        <div id="nhk-end">
            <span class="nhk-final">終</span>
            <div>
                <div class="nhk-text">制作・著作</div>
                <div class="nhk-logo">ＮＨＫ</div>
            </div>
        </div>

        <div class="admin-ui">
            <input type="text" id="userInput" value="Minnie 2026 新年快樂" placeholder="輸入訊息...">
            <div class="btn-row">
                <button class="confirm-btn" onclick="updatePreview()">預覽</button>
                <button class="share-btn" onclick="shareAndCopy()">分享</button>
            </div>
        </div>
    </div>

<script>
    const v = document.getElementById('v');
    const canvas = document.getElementById('drawingCanvas');
    const nhkEnd = document.getElementById('nhk-end');
    const ctx = canvas.getContext('2d');
    const inputField = document.getElementById('userInput');
    
    let currentText = inputField.value;

    const urlParams = new URLSearchParams(window.location.search);
    const urlText = urlParams.get('text');
    if (urlText) {
        currentText = decodeURIComponent(urlText);
        inputField.value = currentText;
        document.body.classList.add('viewer-mode');
        window.addEventListener('click', () => { v.muted = false; }, { once: true });
    }

    function updatePreview() {
        currentText = inputField.value;
        v.currentTime = 0;
        v.play();
    }

    function shareAndCopy() {
        const shareUrl = `${window.location.origin}${window.location.pathname}?text=${encodeURIComponent(inputField.value)}`;
        navigator.clipboard.writeText(shareUrl).then(() => {
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => toast.style.opacity = '0', 2000);
        });
    }

    // 數據區 (為節省長度，請確保在此處貼上之前的完整 trackingData)
    const trackingData = {"3.64":[{"x":"0.1071","y":"0.6915"},{"x":"0.9238","y":"0.6809"},{"x":"0.9238","y":"0.9468"},{"x":"0.1905","y":"0.9839"}],"6.04":[{"x":"0.2429","y":"0.6651"},{"x":"0.8929","y":"0.6347"},{"x":"0.9000","y":"0.8503"},{"x":"0.2929","y":"0.8741"}]}; 
    // 請記得把之前的 trackingData 全部內容貼回上面這行

    const keys = Object.keys(trackingData).map(Number).sort((a,b)=>a-b);

    function getPointsAtTime(t) {
        if (t < keys[0] || t > keys[keys.length-1]) return null;
        let idx = keys.findIndex(k => k > t) - 1;
        if (idx < 0) idx = 0;
        const t1 = keys[idx], t2 = keys[idx+1];
        const p1 = trackingData[t1], p2 = trackingData[t2];
        const r = (t - t1) / (t2 - t1);
        return p1.map((p, i) => ({
            x: parseFloat(p.x) + (parseFloat(p2[i].x) - parseFloat(p.x)) * r,
            y: parseFloat(p.y) + (parseFloat(p2[i].y) - parseFloat(p.y)) * r
        }));
    }

    function drawSmartChalk(pts, text) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const temp = document.createElement('canvas');
        temp.width = 600; temp.height = 400;
        const tCtx = temp.getContext('2d');
        const len = text.length || 1;
        let fontSize = Math.max(35, Math.min(95, 450 / Math.sqrt(len * 2))); 
        tCtx.fillStyle = "rgba(255,255,255,0.92)";
        tCtx.textAlign = "center";
        tCtx.textBaseline = "middle";
        let lines = (len > 8) ? [text.substring(0, Math.ceil(len/2)), text.substring(Math.ceil(len/2))] : [text];
        if (len > 8) fontSize *= 1.1;
        tCtx.font = `bold ${fontSize}px "Microsoft JhengHei", sans-serif`;
        lines.forEach((line, i) => {
            const y = (lines.length > 1) ? (200 + (i * fontSize * 1.1 - (fontSize/2))) : 200;
            tCtx.fillText(line, 300, y);
        });
        const p = pts.map(pt => ({ x: pt.x * canvas.width, y: pt.y * canvas.height }));
        const centerX = (p[0].x + p[1].x + p[2].x + p[3].x) / 4;
        const centerY = (p[0].y + p[1].y + p[2].y + p[3].y) / 4;
        const angle = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
        const boardWidth = Math.sqrt(Math.pow(p[1].x - p[0].x, 2) + Math.pow(p[1].y - p[0].y, 2));
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle);
        ctx.scale((boardWidth * 0.88) / temp.width, (boardWidth * 0.88) / temp.width);
        ctx.drawImage(temp, -300, -200);
        ctx.restore();
    }

    function animate() {
        const cur = v.currentTime;

        // --- 強制觸發 NHK 邏輯 (使用絕對秒數) ---
        // 假設影片在 6 秒左右結束，我們設定在 4.8 秒顯示
        if (cur >= 4.8 && cur < 6.0) {
            nhkEnd.style.opacity = '1';
        } else {
            nhkEnd.style.opacity = '0';
        }

        const pts = getPointsAtTime(cur);
        if (pts) drawSmartChalk(pts, currentText);
        else ctx.clearRect(0,0,canvas.width,canvas.height);
        
        requestAnimationFrame(animate);
    }

    v.addEventListener('loadedmetadata', () => {
        canvas.width = v.clientWidth;
        canvas.height = v.clientHeight;
        animate();
    });

    // 解決部分手機瀏覽器不觸發 loadedmetadata 的問題
    setTimeout(() => {
        if (canvas.width === 0) {
            canvas.width = v.clientWidth;
            canvas.height = v.clientHeight;
        }
    }, 500);
</script>
</body>
</html>
