    <style>
        body { background: #000; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: sans-serif; }
        .phone-frame { position: relative; width: 100vw; height: 100vh; max-width: 450px; max-height: 800px; overflow: hidden; background: #000; perspective: 1000px; }
        #v { position: absolute; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
        
        /* 文字層：使用 3D 變形 */
        #text-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; pointer-events: none; transform-style: preserve-3d;
        }
        #inner-text {
            position: absolute; width: 300px; height: 150px; /* 參考尺寸 */
            display: flex; align-items: center; justify-content: center;
            color: rgba(255,255,255,0.95); font-weight: bold; text-align: center;
            font-size: 32px; transform-origin: 0 0;
            mix-blend-mode: screen; filter: blur(0.3px) brightness(1.2);
        }

        /* NHK 標誌：最高層級，強制顯示 */
        #nhk-end {
            position: absolute; bottom: 50px; right: 25px; z-index: 9999 !important;
            color: white; font-weight: bold; opacity: 0; transition: opacity 0.4s;
            display: flex; align-items: flex-end; gap: 8px; pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .nhk-logo { border: 2.5px solid white; padding: 2px 8px; font-size: 24px; line-height: 1.1; }
        .nhk-final { font-size: 38px; font-style: italic; margin-right: 5px; }

        .admin-ui { position: absolute; bottom: 30px; width: 100%; z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 12px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); padding-bottom: 20px;}
        body.viewer-mode .admin-ui { visibility: hidden; } /* 使用 visibility 確保不影響其他元素 */
        
        input { padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.3); background: rgba(20,20,20,0.9); color: #fff; width: 85%; text-align: center; }
        button { padding: 12px 24px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; }
        #toast { position: fixed; top: 40px; background: #32D74B; color: white; padding: 10px 25px; border-radius: 20px; opacity: 0; transition: opacity 0.3s; z-index: 10000; }
    </style>
</head>

    // --- 關鍵：矩陣轉換函數 ---
    function getMatrix3d(subs, refs) {
        function adj(m) {
            return [
                m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4],
                m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5],
                m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3]
            ];
        }
        function mult(a, b) {
            let res = new Array(9).fill(0);
            for(let i=0; i<3; i++) for(let j=0; j<3; j++) for(let k=0; k<3; k++) res[i*3+j] += a[i*3+k]*b[k*3+j];
            return res;
        }
        function basisToPoints(x1, y1, x2, y2, x3, y3, x4, y4) {
            let m = [x1, x2, x3, y1, y2, y3, 1, 1, 1];
            let v = mult(adj(m), [x4, y4, 1]);
            return mult(m, [v[0], 0, 0, 0, v[1], 0, 0, 0, v[2]]);
        }
        let s = basisToPoints(...subs), d = basisToPoints(...refs);
        let m = mult(d, adj(s));
        for(let i=0; i<9; i++) m[i] /= m[8];
        return [m[0], m[3], 0, m[6], m[1], m[4], 0, m[7], 0, 0, 1, 0, m[2], m[5], 0, 1];
    }

    function animate() {
        const cur = v.currentTime;
        
        // NHK 顯示：4.8秒後顯示，結束後重置
        if (cur >= 4.8 && cur < 6.0) { nhkEnd.style.opacity = '1'; }
        else { nhkEnd.style.opacity = '0'; }

        // 定位文字
        let idx = keys.findIndex(k => k > cur) - 1;
        if (idx >= 0 && keys[idx+1]) {
            const t1 = keys[idx], t2 = keys[idx+1];
            const r = (cur - t1) / (t2 - t1);
            const p1 = trackingData[t1], p2 = trackingData[t2];
            
            const pts = p1.map((p, i) => ({
                x: (parseFloat(p.x) + (parseFloat(p2[i].x) - parseFloat(p.x)) * r) * v.clientWidth,
                y: (parseFloat(p.y) + (parseFloat(p2[i].y) - parseFloat(p.y)) * r) * v.clientHeight
            }));

            // 將文字框的四個角鎖死在黑板定位點上
            const matrix = getMatrix3d(
                [0, 0, 300, 0, 0, 150, 300, 150], // 原始文字尺寸
                [pts[0].x, pts[0].y, pts[1].x, pts[1].y, pts[3].x, pts[3].y, pts[2].x, pts[2].y]
            );
            textDiv.style.transform = `matrix3d(${matrix.join(',')})`;
            textDiv.innerText = inputField.value;
            textDiv.style.visibility = 'visible';
        } else {
            textDiv.style.visibility = 'hidden';
        }
        requestAnimationFrame(animate);
    }

    // 模式判斷
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('text')) {
        inputField.value = decodeURIComponent(urlParams.get('text'));
        document.body.classList.add('viewer-mode');
        window.addEventListener('click', () => { v.muted = false; }, { once: true });
    }

    function updatePreview() {
        v.currentTime = 0;
        v.play();
    }

    function shareAndCopy() {
        const url = `${window.location.origin}${window.location.pathname}?text=${encodeURIComponent(inputField.value)}`;
        navigator.clipboard.writeText(url).then(() => {
            const t = document.getElementById('toast');
            t.style.opacity = 1; setTimeout(() => t.style.opacity = 0, 2000);
        });
    }

    v.onplay = () => animate();
</script>
